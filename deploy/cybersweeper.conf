# CyberSweeper's download page and builds: static files, no backend.
# Public via Cloudflare Tunnel only, at https://__HOST__.
# Loopback-only listener; cloudflared forwards here. No inbound ports.
# deploy/deploy.sh fills in __HOST__ and __WEBROOT__ from deploy/site.env and
# installs this as /etc/nginx/conf.d/cybersweeper.conf.

server {
    listen      127.0.0.1:80;
    server_name __HOST__;

    root  __WEBROOT__;
    index index.html;

    server_tokens off;

    # Cloudflare terminates TLS and sets X-Forwarded-Proto. Bounce plain-http
    # visitors to https. Local curl sends no such header, so it's unaffected.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # "/" serves index.html through the index directive above.
    location = / {
    }

    # The page changes with every release, so browsers and Cloudflare re-check
    # it. It loads nothing from anywhere else, which the CSP enforces.
    # (add_header in a location replaces the server's, so each block lists its own.)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /SHA256SUMS {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The downloads. The page links them with ?v=<checksum>, so every build
    # gets a fresh URL and Cloudflare never hands out an old cached copy.
    location ~ ^/CyberSweeper-(windows\.zip|macos\.zip|linux\.tar\.gz)$ {
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nothing else lives here.
    location / {
        return 404;
    }
}
