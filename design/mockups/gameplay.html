<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CyberSweeper — gameplay</title>
<link rel="stylesheet" href="../shared/cs.css">
<link rel="stylesheet" href="../shared/screens.css">
</head>
<body>
<!-- Gameplay v2: corporate-clean board (TETSUKAGE secure lattice) under a street-deck HUD.
     Params: ?palette=<id>  &links=1..3  &signal=0..100  &strain=0|1|2 -->
<div id="screen"></div>
<script src="../shared/board.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/screens.js"></script>
<script>
  CS.applyPalette(); CS.injectGlyphs();
  const q = new URLSearchParams(location.search);
  const links = +(q.get("links") ?? 2), signal = +(q.get("signal") ?? 72);
  const strain = q.has("strain") ? +q.get("strain") : (links <= 1 ? 1 : 0) + (signal < 10 ? 1 : 0);
  CS.buildGame(document.getElementById("screen"), { links, signal, strain });
  FX.tickers(document);
</script>
</body>
</html>
